<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>농장 근태·급여 (시안)</title>
<style>
:root{--g:#2f6b3c;--bg:#f4f5f1;--line:#dfe2d8;--mut:#6b7265;--red:#b3402e;--amb:#a86a00}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:#1d211b;font-size:15px;line-height:1.5}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:76px}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:16px}
header select{padding:6px;border-radius:6px;border:0;font-size:14px;max-width:55%}
main{padding:16px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:#fff;border-top:1px solid var(--line)}
nav button{flex:1;padding:14px 0;border:0;border-radius:0;background:none;font-size:13px;color:var(--mut)}
nav button.on{color:var(--g);font-weight:700;box-shadow:inset 0 3px var(--g)}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
button.pri{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
button.big{width:100%;padding:18px;font-size:18px;margin-top:10px}
button.no{color:var(--red)}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
input:disabled{background:var(--bg);color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;margin-top:8px}
.mut{color:var(--mut);font-size:13px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);white-space:nowrap}
.chip.ok{background:#e1efe3;color:var(--g)}
.chip.wait{background:#f8ecd2;color:var(--amb)}
.chip.bad{background:#f6dfda;color:var(--red)}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:3px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:400}
tr.sel{background:#eef4ee}
tr.tot td{font-weight:700}
.slip{border:1px solid #1d211b;border-radius:6px;padding:12px;margin-top:10px}
.slip h3{margin:0 0 6px;text-align:center}
.slip td:last-child,.slip th:last-child{color:var(--mut);font-size:12px}
.net{font-size:17px;font-weight:700;text-align:right;margin:10px 0 0}
.now{font-size:20px;font-weight:700;margin:8px 0}
.note{font-size:12px;color:var(--mut);background:var(--bg);padding:8px 10px;border-radius:8px;margin-top:14px}
button.out{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.okmsg{background:#e1efe3;border-color:var(--g);color:var(--g);font-weight:700}
.errmsg{background:#f6dfda;border-color:var(--red);color:var(--red);font-weight:700}
.qrpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;break-inside:avoid}
.qr{border:3px solid var(--g);border-radius:10px;padding:10px;text-align:center}
.qr.out{border-color:var(--red)}
.qr b{display:block;font-size:17px;color:var(--g);margin-bottom:6px}
.qr.out b{color:var(--red)}
.qr svg{width:100%;height:auto;display:block}
@media print{header,nav,.noprint{display:none!important}#app{max-width:none;padding:0}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
const KEY='farmpay-proto-v1';
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const hm=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const sum=a=>a.reduce((s,x)=>s+x[1],0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WORK={ot:'연장근무',night:'야간근무',hol:'휴일근무'};
const KIND={...WORK,fix:'출퇴근 정정',leave:'휴가'};
const CHIP={'대기':'wait','승인':'ok','반려':'bad'};

function seed(){
  const farms=['1농장','2농장','3농장','4농장'].map((name,i)=>({id:i+1,name}));
  const names=['김민수','이영희','박철수','최지은','정대호','응우옌 반 안','쩐 티 흐엉','소카 림','한상우','오미경'];
  const emps=names.map((name,i)=>{
    const type=['월급','월급','일급','시급'][i%4];
    return {id:i+1,name,type,base:{월급:2600000,일급:110000,시급:11000}[type],
      rates:{ot:15000,night:16500,hol:15000},
      allow:[{n:'식대',a:100000},i%3==0?{n:'직책수당',a:150000}:{n:'',a:0},{n:'',a:0}],
      mgmt:i>=5&&i<=7?200000:0};
  });
  const punches=[];let id=1;
  const t=new Date(),y=t.getFullYear(),m=t.getMonth();
  for(let d=1;d<t.getDate();d++){
    const dt=new Date(y,m,d);
    if(dt.getDay()==0)continue;
    emps.forEach((e,i)=>{if((d+i)%11)punches.push({id:id++,emp:e.id,farm:i%4+1,date:dstr(dt),in:'08:00',out:'17:00'})});
  }
  emps.slice(0,6).forEach((e,i)=>punches.push({id:id++,emp:e.id,farm:i%4+1,date:today(),in:'07:5'+i,out:''}));
  const ago=k=>dstr(new Date(y,m,Math.max(1,t.getDate()-k)));
  const rq=(emp,kind,k,hours,reason,status)=>({id:id++,emp,kind,date:ago(k),hours,reason,status});
  const reqs=[rq(1,'ot',3,2,'출하 물량 포장','승인'),rq(2,'night',2,2,'하우스 보온 점검','승인'),
    rq(3,'ot',1,3,'모종 정식 마무리','대기'),rq(6,'hol',1,4,'일요일 관수 작업','대기'),rq(4,'leave',0,0,'병원 진료','대기')];
  return {farms,emps,punches,reqs,pay:{},payDay:10,nid:id};
}

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let cur='admin',tab='',ym=today().slice(0,7),rk='ot',attEmp=0,preview=0,editEmp=0,slipYm='',msg=null,scan=null,showQR=0;
const fname=id=>S.farms.find(f=>f.id==id)?.name??'-';
const farm=id=>esc(fname(id));
const emp=id=>S.emps.find(e=>e.id==id);
const farmOpts=sel=>S.farms.map(f=>`<option value="${f.id}" ${f.id==sel?'selected':''}>${esc(f.name)}</option>`).join('');
const monthInput=()=>`<label>대상 월<input type="month" value="${ym}" onchange="if(this.value){ym=this.value;render()}"></label>`;

/* ---------- 계산 ---------- */
// 정규 근무시간: 하루 출퇴근 합계에서 4시간 초과 시 휴게 1시간 제외, 하루 8시간 한도.
// 8시간을 넘는 근무는 승인된 연장/야간/휴일 요청 시간만 수당으로 반영.
function stats(id,m){
  const byDay={};
  S.punches.filter(p=>p.emp==id&&p.date.startsWith(m)&&p.out)
    .forEach(p=>byDay[p.date]=(byDay[p.date]||0)+Math.max(0,hm(p.out)-hm(p.in)));
  let reg=0;
  for(const d in byDay){let x=byDay[d];if(x>240)x-=60;reg+=Math.min(480,x)}
  const st={days:Object.keys(byDay).length,reg:Math.round(reg/6)/10,ot:0,night:0,hol:0,leave:0};
  S.reqs.filter(r=>r.emp==id&&r.date.startsWith(m)&&r.status=='승인').forEach(r=>{
    if(WORK[r.kind])st[r.kind]+=r.hours;else if(r.kind=='leave')st.leave++;
  });
  return st;
}
function prow(id,m){S.pay[m]??={};return S.pay[m][id]??={}}
function calc(e,m){
  const st=stats(e.id,m),r=prow(e.id,m);
  const base=e.type=='월급'?e.base:e.type=='일급'?st.days*e.base:Math.round(st.reg*e.base);
  const note=e.type=='월급'?'월 고정':e.type=='일급'?`${st.days}일 × ${won(e.base)}`:`${st.reg}시간 × ${won(e.base)}`;
  const items=[['기본급',base,note]];
  for(const k in WORK)if(st[k])items.push([WORK[k]+'수당',st[k]*e.rates[k],`${st[k]}시간 × ${won(e.rates[k])}`]);
  e.allow.forEach(a=>{if(a.n&&a.a)items.push([a.n,a.a,'고정 수당'])});
  if(r.inc)items.push(['인센티브',r.inc,'']);
  const ded=[['4대보험',r.ins||0],['소득세',r.tax||0],['관리비',r.mgmt??e.mgmt]].filter(d=>d[1]);
  const gross=sum(items),dsum=sum(ded);
  return {st,items,ded,gross,dsum,net:gross-dsum};
}

/* ---------- 직원 화면 ---------- */
function vClock(){
  const mine=S.punches.filter(p=>p.emp==cur);
  const ps=mine.filter(p=>p.date==today()),open=ps.find(p=>!p.out);
  const m=msg;msg=null;
  return `<h2>${today()} 출퇴근</h2>
    <p class="now">${open?`${farm(open.farm)} 근무 중 · ${open.in} 출근`:'출근 전입니다'}</p>
    ${m?`<div class="card ${m.ok?'okmsg':'errmsg'}">${esc(m.t)}</div>`:''}
    <p>농장에 붙어 있는 <b>${open?'퇴근':'출근'} QR 코드</b>를 휴대폰 카메라로 찍으면 기록됩니다. 농장 안에서 찍어야 하며 위치 권한이 필요합니다.</p>
    <div class="card"><div class="mut">시안용 QR 찍기 (실제로는 카메라로 찍습니다)</div>
      <label>어느 농장의 QR<select id="cf">${farmOpts(open?.farm??mine.at(-1)?.farm)}</select></label>
      <div class="grid"><button class="pri" onclick="doScan('in',+document.getElementById('cf').value)">출근 QR 찍기</button>
      <button class="out" onclick="doScan('out',+document.getElementById('cf').value)">퇴근 QR 찍기</button></div></div>
    <h3>오늘 기록</h3>`+(ps.map(p=>`<div class="card row"><span>${farm(p.farm)}</span><span>${p.in} ~ ${p.out||'근무 중'}</span></div>`).join('')||'<p class="mut">기록이 없습니다.</p>');
}
// QR을 찍은 순간의 시각으로 기록. 퇴근 QR은 출근한 농장의 것만 인정.
// 위치가 등록된 농장은 QR을 찍은 휴대폰이 농장 반경 안에 있을 때만 기록.
const GEO={enableHighAccuracy:true,timeout:10000};
function dist(a,b,c,d){ // 두 좌표 사이 거리(m)
  const R=Math.PI/180,x=Math.sin((c-a)*R/2)**2+Math.cos(a*R)*Math.cos(c*R)*Math.sin((d-b)*R/2)**2;
  return 12742000*Math.asin(Math.sqrt(x));
}
function doScan(act,fid){
  const f=S.farms.find(x=>x.id==fid),who=cur;
  if(!f||f.lat==null)return record(act,fid);
  const fail=()=>{msg={t:'위치를 확인할 수 없습니다. 휴대폰의 위치 권한을 허용한 뒤 다시 찍어 주세요.'};render()};
  if(!navigator.geolocation)return fail();
  msg={ok:1,t:'위치 확인 중입니다...'};render();
  navigator.geolocation.getCurrentPosition(p=>{
    if(cur!==who)return;
    const d=Math.round(dist(p.coords.latitude,p.coords.longitude,f.lat,f.lng));
    if(d>f.rad){msg={t:`${f.name}에서 약 ${d.toLocaleString('ko-KR')}m 떨어져 있습니다. 농장 안에서 찍어 주세요.`};render()}
    else record(act,fid);
  },fail,GEO);
}
function setFarmLoc(id){
  if(!navigator.geolocation)return alert('이 기기에서는 위치를 확인할 수 없습니다.');
  navigator.geolocation.getCurrentPosition(p=>{
    const f=S.farms.find(x=>x.id==id);
    f.lat=p.coords.latitude;f.lng=p.coords.longitude;f.rad??=200;save();render();
  },()=>alert('위치를 확인할 수 없습니다. 위치 권한을 허용해 주세요.'),GEO);
}
function setFarmCoord(id){
  const v=document.getElementById('co'+id).value.trim().split(/[,\s]+/),lat=+v[0],lng=+v[1];
  if(v.length!=2||v.includes('')||isNaN(lat)||isNaN(lng)||Math.abs(lat)>90||Math.abs(lng)>180)
    return alert('좌표를 "위도, 경도" 순서로 입력해 주세요. 예: 36.12345, 127.56789');
  Object.assign(S.farms.find(x=>x.id==id),{lat,lng}).rad??=200;save();render();
}
function record(act,fid){
  const f=S.farms.find(x=>x.id==fid),t=nowHM();
  const open=S.punches.find(p=>p.emp==cur&&p.date==today()&&!p.out);
  if(!f)msg={t:'등록되지 않은 QR 코드입니다.'};
  else if(act=='in'){
    if(open)msg={t:`이미 ${fname(open.farm)}에 출근한 상태입니다. 먼저 퇴근 QR을 찍어 주세요.`};
    else{S.punches.push({id:S.nid++,emp:cur,farm:fid,date:today(),in:t,out:''});msg={ok:1,t:`${f.name} 출근 ${t} 기록되었습니다.`}}
  }else if(!open)msg={t:'출근 기록이 없습니다. 출근 QR을 먼저 찍어 주세요.'};
  else if(open.farm!=fid)msg={t:`${fname(open.farm)}에서 출근했습니다. ${fname(open.farm)} 퇴근 QR을 찍어 주세요.`};
  else{open.out=t;msg={ok:1,t:`${f.name} 퇴근 ${t} 기록되었습니다.`}}
  save();render();
}
function readHash(){
  const m=location.hash.match(/^#qr=(in|out)-(\d+)$/);
  if(!m)return;
  scan=[m[1],+m[2]];
  try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}
}

function reqLine(r,withName){
  const what=WORK[r.kind]?`${r.hours}시간`:r.kind=='fix'?`${farm(r.farm)} ${r.in}~${r.out}`:'1일';
  return `<div class="row"><b>${withName?esc(emp(r.emp).name)+' · ':''}${KIND[r.kind]}</b><span class="chip ${CHIP[r.status]}">${r.status}</span></div>
    <div class="mut">${r.date} · ${what} · ${esc(r.reason)}${r.reject?`<br>반려 사유: ${esc(r.reject)}`:''}</div>`;
}
function vReq(){
  const list=S.reqs.filter(r=>r.emp==cur).reverse();
  return `<h2>근무 승인요청</h2><div class="card">
    <label>요청 종류<select onchange="rk=this.value;render()">${Object.keys(KIND).map(k=>`<option value="${k}" ${k==rk?'selected':''}>${KIND[k]}</option>`).join('')}</select></label>
    <label>날짜<input type="date" id="rd" value="${today()}"></label>
    ${WORK[rk]?`<label>시간(시간 단위)<input type="number" id="rh" min="0.5" step="0.5" value="2"></label>`:''}
    ${rk=='fix'?`<label>농장<select id="rf">${farmOpts()}</select></label>
      <div class="grid"><label>출근 시각<input type="time" id="ri" value="08:00"></label><label>퇴근 시각<input type="time" id="ro" value="17:00"></label></div>`:''}
    <label>사유<input id="rr" placeholder="예: 출하 물량 포장"></label>
    <button class="pri" onclick="submitReq()">승인 요청</button></div>
    <h3>내 요청 내역</h3>`+(list.map(r=>`<div class="card">${reqLine(r)}</div>`).join('')||'<p class="mut">요청 내역이 없습니다.</p>');
}
function submitReq(){
  const v=id=>document.getElementById(id)?.value;
  const r={id:S.nid++,emp:cur,kind:rk,date:v('rd'),hours:0,reason:(v('rr')||'').trim(),status:'대기'};
  if(!r.date||!r.reason)return alert('날짜와 사유를 입력해 주세요.');
  if(WORK[rk]){r.hours=+v('rh');if(!(r.hours>0))return alert('시간을 입력해 주세요.')}
  if(rk=='fix'){Object.assign(r,{farm:+v('rf'),in:v('ri'),out:v('ro')});if(!r.in||!r.out||hm(r.out)<=hm(r.in))return alert('출퇴근 시각을 확인해 주세요.')}
  S.reqs.push(r);save();render();
}
function statLine(st){return `근무 ${st.days}일 · 정규 ${st.reg}시간 · 연장 ${st.ot} · 야간 ${st.night} · 휴일 ${st.hol}시간 · 휴가 ${st.leave}일`}
function dayList(id){
  const ps=S.punches.filter(p=>p.emp==id&&p.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="scroll"><table><tr><th>날짜</th><th>농장</th><th>출근</th><th>퇴근</th></tr>`+
    ps.map(p=>`<tr><td>${p.date.slice(5)}</td><td>${farm(p.farm)}</td><td>${p.in}</td><td>${p.out||'-'}</td></tr>`).join('')+`</table></div>`;
}
function vMy(){return `<h2>내 근태</h2>${monthInput()}<div class="card">${statLine(stats(cur,ym))}</div>${dayList(cur)}`}
const sentMonths=()=>Object.keys(S.pay).filter(m=>S.pay[m][cur]?.sent).sort().reverse();
function vSlip(){
  const ms=sentMonths();
  if(!ms.length)return '<h2>급여명세서</h2><p class="mut">아직 발송된 명세서가 없습니다.</p>';
  if(!ms.includes(slipYm))slipYm=ms[0];
  const r=S.pay[slipYm][cur];
  if(!r.viewed){r.viewed=today();save()}
  return `<h2>급여명세서</h2><div class="row" style="justify-content:flex-start">${ms.map(m=>`<button class="${m==slipYm?'pri':''}" onclick="slipYm='${m}';render()">${m}</button>`).join('')}</div>${slip(emp(cur),slipYm,r.snap)}`;
}
function slip(e,m,c){
  const [y,mo]=m.split('-').map(Number);
  const tr=(a,n)=>`<tr><td>${esc(a[0])}</td><td>${won(a[1])}</td><td>${esc(n??'')}</td></tr>`;
  return `<div class="slip"><h3>${y}년 ${mo}월 급여명세서</h3>
    <p class="mut">성명 ${esc(e.name)} · 지급일 ${dstr(new Date(y,mo,S.payDay))}<br>${statLine(c.st)}</p>
    <div class="scroll"><table><tr><th>지급 항목</th><th>금액</th><th>계산 근거</th></tr>${c.items.map(a=>tr(a,a[2])).join('')}
    <tr class="tot"><td>지급 합계</td><td>${won(c.gross)}</td><td></td></tr>
    <tr><th>공제 항목</th><th>금액</th><th></th></tr>${c.ded.map(a=>tr(a)).join('')}
    <tr class="tot"><td>공제 합계</td><td>${won(c.dsum)}</td><td></td></tr></table></div>
    <p class="net">실지급액 ${won(c.net)}</p></div>`;
}

/* ---------- 대표 화면 ---------- */
const pending=()=>S.reqs.filter(r=>r.status=='대기');
function vDash(){
  const ps=S.punches.filter(p=>p.date==today()),came=new Set(ps.map(p=>p.emp));
  const names=a=>a.map(p=>esc(emp(p.emp).name)).join(', ')||'-';
  return `<h2>${today()} 현황</h2>
    <div class="card row"><span>미처리 승인요청</span><button class="pri" onclick="tab='inbox';render()">${pending().length}건 보기</button></div>`+
    S.farms.map(f=>{const fp=ps.filter(p=>p.farm==f.id);
      return `<div class="card"><b>${esc(f.name)}</b><div class="mut">근무 중: ${names(fp.filter(p=>!p.out))}<br>퇴근: ${names(fp.filter(p=>p.out))}</div></div>`}).join('')+
    `<div class="card"><b>미출근</b><div class="mut">${S.emps.filter(e=>!came.has(e.id)).map(e=>esc(e.name)).join(', ')||'-'}</div></div>`;
}
function vInbox(){
  const p=pending(),done=S.reqs.filter(r=>r.status!='대기').reverse().slice(0,10);
  return `<div class="row"><h2>승인함</h2>${p.length?`<button onclick="approveAll()">전체 승인</button>`:''}</div>`+
    (p.map(r=>`<div class="card">${reqLine(r,1)}<div class="row" style="justify-content:flex-end;margin-top:8px">
      <button class="no" onclick="decide(${r.id},0)">반려</button><button class="pri" onclick="decide(${r.id},1)">승인</button></div></div>`).join('')||'<p class="mut">대기 중인 요청이 없습니다.</p>')+
    `<h3>최근 처리 내역</h3>`+done.map(r=>`<div class="card">${reqLine(r,1)}</div>`).join('');
}
function apply(r){
  r.status='승인';
  if(r.kind=='fix'){ // 승인된 정정은 해당 날짜 기록을 대체
    S.punches=S.punches.filter(p=>!(p.emp==r.emp&&p.date==r.date));
    S.punches.push({id:S.nid++,emp:r.emp,farm:r.farm,date:r.date,in:r.in,out:r.out});
  }
}
function decide(id,ok){
  const r=S.reqs.find(x=>x.id==id);
  if(ok)apply(r);
  else{const why=prompt('반려 사유를 입력해 주세요.');if(why===null)return;r.status='반려';r.reject=why}
  save();render();
}
function approveAll(){if(confirm(`대기 중인 ${pending().length}건을 모두 승인할까요?`)){pending().forEach(apply);save();render()}}
function vAtt(){
  return `<h2>근태 관리</h2>${monthInput()}<div class="scroll"><table>
    <tr><th>직원</th><th>근무일</th><th>정규</th><th>연장</th><th>야간</th><th>휴일</th><th>휴가</th></tr>`+
    S.emps.map(e=>{const s=stats(e.id,ym);
      return `<tr class="${attEmp==e.id?'sel':''}" onclick="attEmp=attEmp==${e.id}?0:${e.id};render()"><td>${esc(e.name)}</td><td>${s.days}</td><td>${s.reg}</td><td>${s.ot}</td><td>${s.night}</td><td>${s.hol}</td><td>${s.leave}</td></tr>`}).join('')+
    `</table></div><p class="mut">직원을 누르면 일별 기록이 보입니다. 시간 단위는 시간, 근무일·휴가는 일입니다.</p>`+
    (emp(attEmp)?`<h3>${esc(emp(attEmp).name)} 일별 기록</h3>${dayList(attEmp)}`:'');
}
function vPay(){
  let total=0;
  const rows=S.emps.map(e=>{
    const r=prow(e.id,ym),c=r.sent?r.snap:calc(e,ym),lock=r.sent?'disabled':'';
    total+=c.net;
    const inp=(k,l,v)=>`<label>${l}<input type="number" ${lock} value="${v||''}" placeholder="0" onchange="setPay(${e.id},'${k}',this.value)"></label>`;
    return `<div class="card"><div class="row"><b>${esc(e.name)} <span class="mut">${e.type}</span></b>
      <span class="chip ${r.sent?(r.viewed?'ok':'wait'):''}">${r.sent?(r.viewed?'열람 '+r.viewed:'발송됨'):'미발송'}</span></div>
      <div class="row"><span>지급 ${won(c.gross)}</span><span>공제 ${won(c.dsum)}</span><b>실지급 ${won(c.net)}</b></div>
      <div class="grid">${inp('inc','인센티브',r.inc)}${inp('ins','4대보험',r.ins)}${inp('tax','소득세',r.tax)}${inp('mgmt','관리비',r.mgmt??e.mgmt)}</div>
      <div class="row"><button onclick="preview=preview==${e.id}?0:${e.id};render()">명세서 ${preview==e.id?'닫기':'보기'}</button>
      ${r.sent?`<button class="no" onclick="unsend(${e.id})">발송 취소</button>`:`<button class="pri" onclick="send(${e.id})">발송</button>`}</div>
      ${preview==e.id?slip(e,ym,c):''}</div>`}).join('');
  return `<h2>급여 마감</h2>${monthInput()}
    <div class="card row"><b>실지급 합계 ${won(total)}</b><span><button onclick="csv()">급여대장 내려받기</button> <button class="pri" onclick="sendAll()">전체 발송</button></span></div>${rows}
    <p class="note">발송하면 그 시점의 금액이 명세서로 고정됩니다. 수정하려면 발송 취소 후 다시 발송합니다.</p>`;
}
function setPay(id,k,v){prow(id,ym)[k]=+v||0;save();render()}
function send(id){const r=prow(id,ym);r.snap=calc(emp(id),ym);r.sent=today();delete r.viewed;save();render()}
function unsend(id){const r=prow(id,ym);delete r.sent;delete r.snap;delete r.viewed;save();render()}
function sendAll(){
  const left=S.emps.filter(e=>!prow(e.id,ym).sent);
  if(left.length&&confirm(`${ym} 명세서를 ${left.length}명에게 발송할까요?`))left.forEach(e=>send(e.id));
}
function csv(){
  const head=['성명','급여형태','근무일','정규시간','연장','야간','휴일','지급합계','4대보험','소득세','관리비','공제합계','실지급'];
  const lines=S.emps.map(e=>{const r=prow(e.id,ym),c=r.sent?r.snap:calc(e,ym),d=Object.fromEntries(c.ded);
    return [e.name,e.type,c.st.days,c.st.reg,c.st.ot,c.st.night,c.st.hol,c.gross,d['4대보험']||0,d['소득세']||0,d['관리비']||0,c.dsum,c.net].join(',')});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+[head.join(','),...lines].join('\r\n')],{type:'text/csv'}));
  a.download=`급여대장_${ym}.csv`;a.click();
}
function qrSvg(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2})}
function vQR(){
  const base=location.href.split('#')[0];
  return `<div class="row noprint"><button onclick="showQR=0;render()">← 설정으로</button><button class="pri" onclick="print()">인쇄</button></div>
    <p class="mut noprint">농장마다 출근용과 퇴근용을 따로 붙여 두세요. 직원이 휴대폰 카메라로 찍으면 기록됩니다.</p>`+
    S.farms.map(f=>`<div class="qrpair">${[['in','출근'],['out','퇴근']].map(([a,l])=>`<div class="qr ${a}"><b>${esc(f.name)} ${l}</b>${
      typeof qrcode=='function'?qrSvg(`${base}#qr=${a}-${f.id}`):'<p class="mut">QR 생성에는 인터넷 연결이 필요합니다.</p>'}</div>`).join('')}</div>`).join('');
}
function vSet(){
  if(showQR)return vQR();
  const e=emp(editEmp);
  const num=(id,l,v)=>`<label>${l}<input type="number" id="${id}" value="${v||''}" placeholder="0"></label>`;
  return `<h2>설정</h2><h3>농장</h3>`+
    S.farms.map(f=>`<div class="card"><input value="${esc(f.name)}" aria-label="농장 이름" onchange="S.farms.find(x=>x.id==${f.id}).name=this.value.trim()||'농장';save();render()">
      <div class="row">${f.lat==null?`<span class="chip wait">위치 미등록 · QR만으로 기록</span>`
        :`<span class="chip ok">위치 등록됨 ${f.lat.toFixed(5)}, ${f.lng.toFixed(5)}</span>
          <label style="margin:0">허용 반경(m) <input type="number" min="30" style="width:90px" value="${f.rad}" onchange="S.farms.find(x=>x.id==${f.id}).rad=Math.max(30,+this.value||200);save();render()"></label>`}</div>
      <div class="row"><button onclick="setFarmLoc(${f.id})">현재 위치로 ${f.lat==null?'등록':'다시 등록'}</button>
        ${f.lat==null?'':`<button class="no" onclick="const f=S.farms.find(x=>x.id==${f.id});delete f.lat;delete f.lng;save();render()">위치 해제</button>`}</div>
      <div class="row"><input style="flex:1;width:auto" id="co${f.id}" aria-label="위도, 경도" placeholder="위도, 경도 (예: 36.12345, 127.56789)"><button onclick="setFarmCoord(${f.id})">좌표로 등록</button></div></div>`).join('')+
    `<p class="mut">농장 한가운데에서 "현재 위치로 등록"을 누르거나, 지도에서 복사한 좌표를 "위도, 경도" 순서로 붙여 넣고 "좌표로 등록"을 누르세요. 등록된 농장은 허용 반경 안에서 QR을 찍어야 기록됩니다.</p>`+
    `<button onclick="S.farms.push({id:S.nid++,name:'새 농장'});save();render()">농장 추가</button>
    <button class="pri" onclick="showQR=1;render()">출퇴근 QR 코드 보기·인쇄</button>
    <h3>급여 지급일</h3><label>익월 며칠<input type="number" min="1" max="28" value="${S.payDay}" onchange="S.payDay=Math.min(28,Math.max(1,+this.value||10));save();render()"></label>
    <h3>직원</h3>`+
    S.emps.map(x=>`<div class="card row" onclick="editEmp=editEmp==${x.id}?0:${x.id};render()"><b>${esc(x.name)}</b><span class="mut">${x.type} ${won(x.base)}</span></div>`+
      (e&&e.id==x.id?`<div class="card">
      <label>이름<input id="en" value="${esc(e.name)}"></label>
      <div class="grid"><label>급여 형태<select id="et">${['월급','일급','시급'].map(t=>`<option ${t==e.type?'selected':''}>${t}</option>`).join('')}</select></label>
      ${num('eb','기본 금액(월급/일급/시급)',e.base)}
      ${num('r_ot','연장 시간당',e.rates.ot)}${num('r_night','야간 시간당',e.rates.night)}
      ${num('r_hol','휴일 시간당',e.rates.hol)}${num('em','관리비 공제(월)',e.mgmt)}</div>
      <div class="mut">고정 수당 (최대 3개)</div>
      ${e.allow.map((a,i)=>`<div class="grid"><input id="an${i}" placeholder="수당 이름" value="${esc(a.n)}"><input type="number" id="aa${i}" placeholder="금액" value="${a.a||''}"></div>`).join('<div style="height:6px"></div>')}
      <div class="row" style="margin-top:10px"><span></span><button class="pri" onclick="saveEmp()">저장</button></div></div>`:'')).join('')+
    `<button onclick="addEmp()">직원 추가</button>
    <h3>시안 데이터</h3><button class="no" onclick="if(confirm('입력한 내용을 지우고 예시 데이터로 되돌릴까요?')){S=seed();save();render()}">예시 데이터로 초기화</button>`;
}
function saveEmp(){
  const e=emp(editEmp),v=id=>document.getElementById(id).value;
  e.name=v('en').trim()||e.name;e.type=v('et');e.base=+v('eb')||0;e.mgmt=+v('em')||0;
  for(const k in WORK)e.rates[k]=+v('r_'+k)||0;
  e.allow=[0,1,2].map(i=>({n:v('an'+i).trim(),a:+v('aa'+i)||0}));
  editEmp=0;save();render();
}
function addEmp(){
  const id=S.nid++;
  S.emps.push({id,name:'새 직원',type:'월급',base:0,rates:{ot:0,night:0,hol:0},allow:[0,1,2].map(()=>({n:'',a:0})),mgmt:0});
  editEmp=id;save();render();
}

/* ---------- 공통 ---------- */
function render(){
  const admin=cur==='admin';
  if(scan&&!admin){const s=scan;scan=null;tab='clock';return doScan(...s)}
  const tabs=admin?[['dash','현황'],['inbox','승인함'],['att','근태'],['pay','급여'],['set','설정']]
    :[['clock','출퇴근'],['req','요청'],['my','내 근태'],['slip','명세서']];
  if(!tabs.some(t=>t[0]==tab))tab=tabs[0][0];
  const badge={inbox:admin?pending().length:0,slip:admin?0:sentMonths().filter(m=>!S.pay[m][cur].viewed).length};
  const view={dash:vDash,inbox:vInbox,att:vAtt,pay:vPay,set:vSet,clock:vClock,req:vReq,my:vMy,slip:vSlip}[tab]();
  document.getElementById('app').innerHTML=`<header><b>농장 근태·급여</b>
    <select onchange="cur=this.value=='admin'?'admin':+this.value;render()" aria-label="사용자 전환">
    <option value="admin">대표(관리자)</option>${S.emps.map(e=>`<option value="${e.id}" ${e.id==cur?'selected':''}>${esc(e.name)}</option>`).join('')}</select></header>
    <main>${scan?`<div class="card okmsg">${farm(scan[1])} ${scan[0]=='in'?'출근':'퇴근'} QR을 찍었습니다. 오른쪽 위에서 본인 이름을 선택하세요. (실제 앱에서는 로그인된 직원으로 바로 기록됩니다.)</div>`:''}${view}</main>
    <nav>${tabs.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}${badge[t[0]]?`<span class="badge">${badge[t[0]]}</span>`:''}</button>`).join('')}</nav>`;
}
readHash();
addEventListener('hashchange',()=>{readHash();render()});
render();
</script>
</body>
</html>
